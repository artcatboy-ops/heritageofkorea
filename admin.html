<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Heritage of Korea 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap">
<style>
:root{
  --bg:#EEF0F3; --paper:#FFFFFF; --ink:#0E1430; --muted:#5E6479; --line:#DFE2E9; --chip:#F2F4F7;
  --rail:#0E1430; --rail-ink:#C9CCDA; --rail-on:#FFFFFF; --gold:#C9A24B;
  --accent:#1F5E5A; --accent-ink:#FFFFFF; --accent-soft:#E3EFED;
  --warn:#B3261E; --warn-soft:#FBEAE8; --ok:#1B7F4B; --ok-soft:#E4F3EA; --gold-ink:#7A5A14; --gold-soft:#F7EFD9;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D1A; --paper:#141932; --ink:#EDEAE2; --muted:#9A9DB2; --line:#262C4A; --chip:#1B2140;
  --rail:#070916; --accent:#6CC3B8; --accent-ink:#06201D; --accent-soft:#143532;
  --warn:#FF8A80; --warn-soft:#3A1C1A; --ok:#6FD39C; --ok-soft:#14301F; --gold-ink:#E3C27A; --gold-soft:#2E2813; color-scheme:dark;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);word-break:keep-all;overflow-wrap:break-word}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--serif);font-weight:900;font-size:19px;color:#fff;line-height:1.2;padding:0 10px}
.brand i{color:var(--gold);font-weight:400}
.brand small{display:block;margin-top:6px;font:500 12px var(--sans);color:var(--rail-ink);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border-radius:6px;color:var(--rail-ink);font-size:14.5px;border-left:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.09);color:var(--rail-on);font-weight:700;border-left-color:var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.rail-foot{margin-top:auto;font-size:13px;padding:0 10px}
.rail-foot a{color:var(--rail-ink)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);min-height:60px}
.top h1{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12.5px;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.dotmark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:8px;vertical-align:middle}
#view{padding:clamp(16px,3vw,32px);max-width:1040px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,2.4vw,26px);margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:17px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.field{margin-top:14px}
.field label,.lab{display:block;font-weight:500;margin-bottom:5px;font-size:14px}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 11px}
textarea.in{resize:vertical;line-height:1.7;min-height:84px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.callout{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.callout.ok{background:var(--ok-soft);color:var(--ok)} .callout.bad{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools2 .in{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{display:flex;flex-direction:column;gap:8px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 10px}
.item:hover{border-color:var(--ink)} .item:focus-visible{outline:2px solid var(--accent)}
.item .th{width:64px;height:64px;border-radius:6px;background:var(--chip) center/cover no-repeat}
.item b{display:block;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item small{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-left:4px;white-space:nowrap}
.pill.pub{background:var(--ok-soft);color:var(--ok)} .pill.draft{background:var(--chip);color:var(--muted)} .pill.lead{background:var(--gold-soft);color:var(--gold-ink)}
.pills{text-align:right}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:10px}
/* editor */
.ed{max-width:760px;margin:0 auto}
.edbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.edbar .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px 5px 6px;cursor:pointer}
.switch .k{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch .k::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] .k{background:var(--ok)} .switch[aria-checked="true"] .k::after{transform:translateX(14px)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.meta .in{padding:7px 9px;font-size:14px}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,4vw,44px) clamp(16px,4.4vw,52px) 36px}
.cover{margin-bottom:22px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--chip);width:100%;display:block}
.drop:hover,.drop.on{border-color:var(--accent);color:var(--accent)}
.coverimg{position:relative}
.coverimg img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:10px;background:var(--chip)}
.coverimg .row{position:absolute;right:10px;top:10px}
.cover .in{margin-top:8px;font-size:13.5px}
.e-title{width:100%;border:0;outline:0;background:none;resize:none;overflow:hidden;font:900 clamp(26px,4.4vw,36px)/1.35 var(--serif);letter-spacing:-.01em;padding:0;margin:0 0 6px;color:var(--ink)}
.e-dek{width:100%;border:0;outline:0;background:none;font:400 17px/1.6 var(--sans);color:var(--muted);padding:6px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.e-title::placeholder,.e-dek::placeholder{color:#A4A9BB}
.tb{position:sticky;top:60px;z-index:10;background:var(--paper);border-block:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:6px 2px;margin-bottom:18px;scrollbar-width:none}
.tb button{border:0;background:none;border-radius:6px;padding:6px 11px;font-size:14px;white-space:nowrap;color:var(--ink)}
.tb button:hover{background:var(--chip)}
.tb .bar{width:1px;background:var(--line);margin:4px 6px;flex:none}
.linkbar{display:flex;gap:8px;margin:-6px 0 14px;flex-wrap:wrap}
.prose{position:relative;min-height:320px;outline:0;font:400 18px/1.95 var(--serif);max-width:none}
.prose.empty::before{content:attr(data-ph);position:absolute;left:0;top:0;color:#A4A9BB;pointer-events:none}
.prose p{margin:0 0 1em}
.prose h3{font:900 clamp(21px,2.8vw,25px)/1.4 var(--serif);margin:1.7em 0 .5em}
.prose blockquote{margin:1.5em 0;padding:2px 0 2px 18px;border-left:3px solid var(--accent);font-weight:700;font-size:19px;line-height:1.7}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.fig{position:relative;margin:1.4em 0;display:block}
.fig img{display:block;width:100%;height:auto;border-radius:8px;background:var(--chip)}
.fig-f{display:grid;grid-template-columns:2fr 1.4fr;gap:8px;margin-top:8px}
.fig-f input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 9px;font:400 13px var(--sans);min-width:0}
.fig-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(14,20,48,.75);color:#fff;font-size:18px;line-height:1}
.fig.up img{opacity:.45}
.fig.up::after{content:"사진 올리는 중…";position:absolute;left:0;right:0;top:40%;text-align:center;font:700 14px var(--sans);color:var(--ink)}
.edfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:20px;gap:10px;flex-wrap:wrap}
details.more{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(8,10,28,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 14px}
.modal{background:var(--paper);border-radius:12px;width:min(560px,100%);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(820px,100%);padding:0}
.modal h2{margin:0 0 10px;font-size:18px}
.modal ul{margin:6px 0 12px;padding-left:20px}
.modal .row{margin-top:16px;justify-content:flex-end}
.pv{padding:clamp(18px,4vw,40px)}
.pv .kick{font-size:13px;font-weight:700;color:var(--accent)}
.pv h2{font:900 clamp(26px,4.4vw,36px)/1.35 var(--serif);margin:8px 0 10px}
.pv .dek{font-size:18px;color:var(--muted);margin:0 0 14px}
.pv .by{font-size:13px;color:var(--muted);padding:10px 0;border-block:1px solid var(--line);margin-bottom:22px}
.pv .cv{margin:0 0 6px} .pv .cv img{display:block;width:100%;border-radius:10px;max-height:380px;object-fit:cover}
.pv .cap{font-size:13px;color:var(--muted);margin:0 0 22px}
.pv p.body,.pv ul.bl,.pv ol.bl{font:400 17px/1.95 var(--serif);max-width:62ch;margin:0 0 1.1em}
.pv ul.bl,.pv ol.bl{padding-left:1.4em}
.pv h3.bh{font:900 23px/1.4 var(--serif);margin:1.8em 0 .6em;max-width:62ch}
.pv blockquote.bq{margin:1.8em 0;padding:2px 0 2px 20px;border-left:3px solid var(--accent);max-width:58ch}
.pv blockquote.bq p{margin:0;font:700 20px/1.7 var(--serif)}
.pv blockquote.bq cite{display:block;margin-top:8px;font:normal 13px var(--sans);color:var(--muted)}
.pv figure.bf{margin:1.8em 0}.pv figure.bf img{display:block;width:100%;height:auto;border-radius:10px}
.pv figure.bf figcaption{margin-top:8px;font-size:13px;color:var(--muted)}
.pv a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-size:13.5px;z-index:60;max-width:90vw;text-align:center}
.steps{margin:8px 0 0;padding-left:20px}.steps li{margin-bottom:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto}
  .brand{font-size:15px;white-space:nowrap;padding:0}.brand small,.rail-foot{display:none}
  .nav{flex-direction:row;gap:4px}.nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;padding:8px 10px}
  .nav button[aria-current="page"]{border-bottom-color:var(--gold)}
  .top{top:0}.tb{top:60px}
  .grid2,.fig-f{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:52px minmax(0,1fr)}.item .th{width:52px;height:52px}.item .pills{grid-column:2;text-align:left}
  .save{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Heritage <i>of</i> Korea<small>관리 화면</small></div>
    <nav class="nav" id="nav" aria-label="메뉴"></nav>
    <div class="rail-foot"><a href="./" target="_blank" rel="noopener">사이트 열어 보기</a></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="pageTitle">기사</h1>
      <span class="save" id="saveState"></span>
      <button class="btn" type="button" id="btnPreview" hidden>미리보기</button>
      <button class="btn pri" type="button" id="btnPublish">사이트에 올리기<span class="dotmark" id="dot" hidden title="올리지 않은 변경이 있습니다"></span></button>
    </header>
    <div id="view"></div>
  </div>
</div>
<input id="pickBody" type="file" accept="image/*" hidden>
<input id="pickCover" type="file" accept="image/*" hidden>
<input id="pickJson" type="file" accept=".json,application/json" hidden>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
var DEFAULT = {"sample": true, "site": {"name": "Heritage of Korea", "org": "", "contact": [], "note": ""}, "stories": [{"id": 1, "cat": "국가유산", "title": "단청을 다시 입은 문루, 2년 만에 제 빛을 찾았다", "dek": "안료를 분석해 옛 색을 되살린 보수 현장. 전통 기법과 정밀 계측이 함께 쓰였다.", "by": "한도윤 기자", "time": "오전 9:40", "body": ["2년에 걸친 보수를 마친 문루가 다시 모습을 드러냈다. 전문가들은 남아 있던 단청 조각에서 안료 성분을 분석하고, 같은 재료로 색을 다시 만들었다.", "작업은 비계를 두르고 한 칸씩 진행됐다. 단청장은 붓질 하나하나를 기록으로 남겼고, 기와는 상태가 좋은 것을 골라 다시 올렸다. 정밀 계측 장비는 처마의 휨을 매달 확인했다.", "보수를 이끈 책임 기술자는 새것처럼 보이지 않으면서도 오래 버티게 하는 균형이 가장 어려웠다고 말했다. 이 문루는 보수 과정을 설명하는 해설 프로그램과 함께 일반에 공개된다."], "vid": 252, "img": "gwang", "lead": true}, {"id": 2, "cat": "무형유산", "title": "겨울 쪽 염색 이어 가는 이수자들, 장독에 다시 불을 지폈다", "dek": "발효 상태를 손끝과 냄새로 읽는 일. 이수자 열두 명이 한 해 작업을 시작했다.", "by": "류서현 기자", "time": "오전 8:15", "body": ["쪽빛을 내는 염색은 발효에서 시작한다. 이수자 열두 명이 장독 앞에 모여 올해 첫 염액의 상태를 살폈다. 온도계가 있어도 마지막 판단은 냄새와 거품의 빛깔이 한다.", "전승 교육은 일주일에 닷새씩 이어진다. 한 이수자는 같은 염액이라도 날씨에 따라 색이 달라져, 기록과 감각을 함께 쌓아야 한다고 말했다.", "전승 단체는 올해부터 작업 과정을 영상으로 남기는 기록 사업을 병행한다. 영상은 교육 자료로 쓰이고, 일부는 일반에 공개된다."], "vid": 330}, {"id": 3, "cat": "전시·공연", "title": "가을 궁궐 야간 개방, 올해는 국악 연주와 함께", "dek": "고궁의 저녁 조명 아래 열리는 연주회. 사전 예약은 오픈 직후 마감됐다.", "by": "문하린 기자", "time": "어제 오후 6:30", "body": ["가을 밤 궁궐 야간 개방에 국악 연주가 더해졌다. 정자 앞 마당에서 가야금과 대금 앙상블이 한 시간가량 연주를 이어 간다.", "관람객 수를 제한해 소리가 멀리 퍼지도록 했다. 주최 측은 조명 밝기와 동선을 문화유산 보호 기준에 맞춰 조정했다고 설명했다.", "예약은 문을 연 직후 마감됐고, 추가 회차는 다음 달 초에 열린다."], "vid": 190, "img": "gyeong", "feature": true}, {"id": 4, "cat": "전통예술", "title": "판소리 완창 무대 열흘 연속, 젊은 소리꾼들이 맡는다", "dek": "서너 시간의 완창을 열 명이 번갈아 이어 가는 기획 공연이 열린다.", "by": "한도윤 기자", "time": "어제 오후 4:05", "body": ["판소리 완창 무대가 열흘 동안 이어진다. 서너 시간에 이르는 한 마당을 소리꾼 열 명이 하루씩 맡는다.", "참여자 대부분은 서른 안팎이다. 한 소리꾼은 완창은 체력과 집중을 모두 요구하는 일이라, 무대에 서기 전 여섯 달 동안 호흡 훈련을 했다고 말했다.", "공연장은 객석에 자막 화면을 설치해 처음 듣는 관객도 따라갈 수 있게 했다."]}, {"id": 5, "cat": "보존·복원", "title": "3차원 기록으로 석조 구조물의 균열을 읽는다", "dek": "수천 장의 사진을 겹쳐 만든 입체 모형으로 해마다 달라지는 틈을 비교한다.", "by": "백승민 기자", "time": "어제 오후 2:10", "body": ["연구진이 석조 구조물 한 기를 수천 장의 사진으로 촬영해 3차원 모형을 만들었다. 해마다 같은 방식으로 기록하면 머리카락 굵기 수준의 변화도 비교할 수 있다.", "첫 기록에서는 아랫부분 석재 사이의 틈이 확인됐다. 당장 위험한 수준은 아니지만 빗물이 스며드는 경로를 막는 방안을 검토하고 있다.", "야간 조명의 열기가 석재 온도에 미치는 영향도 함께 잰다. 기록은 보존 계획의 기초 자료로 쓰이고, 일부 모형은 누리집에서 공개될 예정이다."], "img": "cheom", "feature": true}, {"id": 6, "cat": "세계유산", "title": "세계유산 석굴 사원, 내부 습도 관리 계획을 새로 세웠다", "dek": "관람 인원과 환기 시간을 함께 조절해 석조 불상을 지키는 방안이 담겼다.", "by": "류서현 기자", "time": "어제 오전 11:20", "body": ["세계유산으로 지정된 한 석굴 사원이 내부 습도 관리 계획을 새로 세웠다. 관람객의 숨과 바깥 공기가 석재 표면에 이슬을 맺히게 하는 문제를 줄이는 것이 목표다.", "계획에는 시간대별 관람 인원 조절과 환기 주기 변경이 담겼다. 연구진은 센서 수십 개로 석굴 안 온도와 습도를 계속 기록해 계획이 효과가 있는지 확인한다.", "관람 시간이 짧아질 수 있다는 우려에는 해설 영상을 입구에서 먼저 보여 주는 방식으로 대응한다. 시범 운영 결과는 내년 봄에 공개된다."], "vid": 280, "img": "seok", "feature": true}, {"id": 7, "cat": "보존·복원", "title": "고문서 3천 장, 종이 섬유까지 분석해 복원 순서를 정했다", "dek": "훼손 정도와 종이 종류를 먼저 분류한 뒤 가장 급한 문서부터 손본다.", "by": "백승민 기자", "time": "그제 오후 5:00", "body": ["고문서 3천 장의 복원 순서가 정해졌다. 연구진은 종이 섬유와 먹의 상태를 분석해 습기에 약한 문서부터 우선순위를 매겼다.", "복원은 접힌 부분을 펴고 찢긴 자리를 한지로 잇는 작업이 중심이다. 약품은 되도록 쓰지 않고, 쓰더라도 되돌릴 수 있는 방법을 고른다.", "복원을 마친 문서는 디지털 사본으로 만들어 열람 신청 없이 볼 수 있게 할 계획이다."]}, {"id": 8, "cat": "전시·공연", "title": "도자 명품전 개막, 청자와 분청을 한자리에서", "dek": "시대별 도자 120점을 빛의 방향에 따라 다르게 보이도록 배치했다.", "by": "문하린 기자", "time": "그제 오전 10:00", "body": ["청자와 분청을 한자리에 모은 도자 전시가 문을 열었다. 시대별로 120점을 골라, 같은 유약이라도 빛에 따라 색이 달라지는 모습을 볼 수 있게 조명을 달리했다.", "전시장 한쪽에는 가마 단면 모형과 흙 만지기 체험 공간을 마련했다. 어린이 관람객이 특히 오래 머문다고 한다.", "전시는 내년 초까지 이어지고, 주말에는 큐레이터와 함께하는 해설 투어가 열린다."]}, {"id": 9, "cat": "무형유산", "title": "장인의 손끝을 영상으로 남긴다, 전승 기록 사업 2기 시작", "dek": "공정마다 카메라 두 대를 놓고 도구와 손동작을 따로 기록한다.", "by": "류서현 기자", "time": "그제 오전 9:10", "body": ["장인의 작업을 영상으로 기록하는 사업이 2기에 들어갔다. 촬영팀은 전체 장면과 손동작을 따로 찍고, 도구 이름과 쓰임을 자막으로 붙인다.", "기록은 후배 전승자의 교육 자료로 쓰인다. 한 장인은 말로 설명하기 어려운 감각을 화면으로 남길 수 있어 다행이라고 말했다.", "2기에는 목공, 금속 공예, 한지 제작 등 열두 개 분야가 포함된다."], "vid": 205}, {"id": 10, "cat": "전통예술", "title": "한복의 현대 해석, 젊은 디자이너 열 팀의 무대", "dek": "저고리의 선과 색을 일상복으로 옮긴 작품들이 무대에 올랐다.", "by": "문하린 기자", "time": "그제 오전 8:00", "body": ["젊은 디자이너 열 팀이 한복을 현대적으로 해석한 작품을 선보였다. 저고리의 곡선을 셔츠에, 배자의 형태를 겉옷에 옮긴 작품이 눈에 띄었다.", "옷감은 전통 직물과 기능성 소재를 섞어 썼다. 디자이너들은 입고 걷기 편한 한복이 목표라고 말했다.", "전시된 작품 일부는 다음 달 팝업 매장에서 판매된다."]}], "notices": [["11월 야간 개방 사전 예약 일정을 안내합니다", "2026.10.22"], ["전승 기록 영상 2기 촬영 협조 요청", "2026.10.19"], ["가을 보존 과학 공개 강좌 참가자 모집", "2026.10.15"], ["고문서 복원 실습 체험 신청 안내", "2026.10.08"], ["누리집 정기 점검 안내(10월 30일 새벽)", "2026.10.02"]], "press": [["[한결뉴스]", "한옥 보수 현장, 전통 공법과 계측의 만남", "2026.10.21"], ["[누리일간]", "젊은 소리꾼 열 명의 열흘 완창", "2026.10.17"], ["[문화저널]", "도자 명품전, 빛으로 읽는 청자", "2026.10.12"], ["[푸른방송]", "쪽 염색 이수자들의 겨울 채비", "2026.10.09"], ["[아침신문]", "세계유산 후보 마을, 주민이 정한 관리 계획", "2026.10.03"]], "schedule": [["18:30", "궁궐 야간 개방"], ["19:00", "석조 유산 야간 조명"], ["14:00", "한옥 보수 현장 해설"], ["10:00", "도자 명품전 관람 시작"], ["09:00", "석굴 사원 관람 시작"], ["20:00", "국악 연주회 입장"]], "opinions": [["문화유산은 복원이 아니라 이어 쓰기다", "김서연 · 문화재 보존과학자"], ["야간 개방, 빛이 유산을 해치지 않으려면", "이도현 · 건축사"], ["전승자의 손을 기록하는 일", "박하윤 · 민속학자"]], "podcasts": [["헤리티지 라디오 · 고택의 목수들", "24분"], ["헤리티지 라디오 · 쪽빛을 읽는 사람들", "31분"], ["헤리티지 라디오 · 밤의 궁궐 이야기", "19분"]], "partners": [["나루 문화재단"], ["한울 전통공예협회"], ["청연 박물관"], ["누리 국악원"]], "social": {"youtube": {"handle": "헤리티지오브코리아", "channelId": "UCAJ4-HW2yi0PxV6qGsU3q9A"}, "instagram": {"handle": "heritageofkorea", "posts": []}}};

function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function p2(n){return ("0"+n).slice(-2);}
function nowLocal(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+"T"+p2(d.getHours())+":"+p2(d.getMinutes());}

function safeUrl(u){u=String(u||"").trim().replace(/[^\w\-.\/:%~?=&#+@!,]/g,"");if(!u||/^(javascript|data):/i.test(u))return "";return u;}
function okHref(u){u=safeUrl(u);if(/^[a-z][a-z0-9+.\-]*:/i.test(u)&&!/^(https?:|mailto:)/i.test(u))return "";return u;}
function inline(raw){
  raw=String(raw==null?"":raw);
  var out="",re=/\\([\\*\[\]()])|\*\*\*([^*]+?)\*\*\*|\*\*(.+?)\*\*|\*([^*]+?)\*|\[([^\]]+?)\]\(([^)\s]+)\)/g,last=0,m;
  while((m=re.exec(raw))){
    out+=esc(raw.slice(last,m.index));
    if(m[1]!=null)out+=esc(m[1]);
    else if(m[2]!=null)out+="<b><i>"+esc(m[2])+"</i></b>";
    else if(m[3]!=null)out+="<b>"+inline(m[3])+"</b>";
    else if(m[4]!=null)out+="<i>"+esc(m[4])+"</i>";
    else{var u=okHref(m[6]);out+=u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+inline(m[5])+'</a>':inline(m[5]);}
    last=re.lastIndex;
  }
  return out+esc(raw.slice(last));
}
function blockHtml(b){
  if(typeof b==="string"){b=b.trim();return b?'<p class="body">'+inline(b)+'</p>':"";}
  if(!b||typeof b!=="object")return "";
  var t=b.t,i,h;
  if(t==="h"){var tx=String(b.text||"").trim();return tx?'<h3 class="bh">'+esc(tx)+'</h3>':"";}
  if(t==="q"){var q=String(b.text||"").trim();if(!q)return "";return '<blockquote class="bq"><p>'+inline(q)+'</p>'+(b.by?'<cite>'+esc(b.by)+'</cite>':'')+'</blockquote>';}
  if(t==="img"){var src=safeUrl(b.src);if(!src)return "";var cap=String(b.cap||"").trim(),cr=String(b.credit||"").trim();
    return '<figure class="bf"><img src="'+esc(imgCache[b.src]||src)+'" alt="'+esc(cap)+'">'+((cap||cr)?'<figcaption>'+esc(cap)+(cr?(cap?' ':'')+'<span>사진 · '+esc(cr)+'</span>':'')+'</figcaption>':'')+'</figure>';}
  if((t==="ul"||t==="ol")&&Array.isArray(b.items)){h="";for(i=0;i<b.items.length;i++){var it=String(b.items[i]||"").trim();if(it)h+="<li>"+inline(it)+"</li>";}return h?'<'+t+' class="bl">'+h+'</'+t+'>':"";}
  return "";
}

/* ---- data ---- */
function fix(d){
  d=d||{};d.stories=Array.isArray(d.stories)?d.stories:[];d.site=d.site||{};
  LISTS.forEach(function(l){d[l[0]]=Array.isArray(d[l[0]])?d[l[0]]:[];});
  d.social=d.social||{};d.social.youtube=d.social.youtube||{};d.social.instagram=d.social.instagram||{};
  if(!Array.isArray(d.social.instagram.posts))d.social.instagram.posts=[];
  var used={},mx=0;d.stories.forEach(function(s){if(+s.id>mx)mx=+s.id;});
  d.stories.forEach(function(s){
    if(typeof s.body==="string")s.body=s.body.split(/\n\s*\n/);
    if(!Array.isArray(s.body))s.body=[];
    s.body=s.body.map(function(b){return typeof b==="string"?b.trim():b;}).filter(function(b){return b&&(typeof b!=="string"||b);});
    var id=+s.id;if(!id||used[id])id=++mx;used[id]=1;s.id=id;
    s.title=s.title||"";s.dek=s.dek||"";s.by=s.by||"";
    if(CATS.indexOf(s.cat)<0)s.cat=CATS[0];
  });
  d.sample=d.sample===true;return d;
}
function pubData(){
  var d=JSON.parse(JSON.stringify(data));
  d.stories=d.stories.filter(function(s){return !s.draft;});
  d.stories.forEach(function(s,i){
    if(!s.id)s.id=i+1;delete s.draft;delete s.time;
    if(!s.img)delete s.img;if(!s.image)delete s.image;if(!s.video)delete s.video;if(!s.vid)delete s.vid;
    if(!s.credit)delete s.credit;if(!s.lead)delete s.lead;if(!s.feature)delete s.feature;
  });
  return d;
}

function blocksToHtml(bl){

/* body DOM -> blocks */
function mdEsc(t){return t.replace(/\\/g,"\\\\").replace(/\[/g,"\\[").replace(/\]/g,"\\]").replace(/\*/g,"＊");}
function hrefOk(h){h=(h||"").trim();if(!/^(https?:\/\/|mailto:|\/|\.\/|#)/i.test(h)&&/^[a-z][a-z0-9+.\-]*:/i.test(h))return "";return h.replace(/\s/g,"%20").replace(/\(/g,"%28").replace(/\)/g,"%29");}
function inl(n){
  var s="";
  for(var c=n.firstChild;c;c=c.nextSibling){
    if(c.nodeType===3){s+=mdEsc(c.nodeValue.replace(/ /g," "));}
    else if(c.nodeType===1){
      var t=c.tagName,x;
      if(t==="BR")s+=" ";
      else if(t==="B"||t==="STRONG"){x=inl(c);s+=x.trim()?"**"+x+"**":x;}
      else if(t==="I"||t==="EM"){x=inl(c);s+=x.trim()?(/^\*\*[^*]+\*\*$/.test(x)?"*"+x+"*":"*"+x+"*"):x;}
      else if(t==="A"){x=inl(c);var h=hrefOk(c.getAttribute("href"));s+=(h&&x.trim())?"["+x+"]("+h+")":x;}
      else if(t==="FIGURE"){}
      else s+=inl(c);
    }
  }
  return s;
}
var BL={P:1,DIV:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,UL:1,OL:1,BLOCKQUOTE:1,FIGURE:1,LI:1};
function hasBlock(n){for(var c=n.firstChild;c;c=c.nextSibling){if(c.nodeType===1&&BL[c.tagName])return true;}return false;}
function walk(root,out){
  var pend=[],prevQ=null;
  function flush(){if(!pend.length)return;var w=document.createElement("div");pend.forEach(function(n){w.appendChild(n.cloneNode(true));});pend=[];var t=inl(w).replace(/\s+/g," ").trim();if(t)out.push(t);}
  for(var c=root.firstChild;c;c=c.nextSibling){
    if(c.nodeType===3){pend.push(c);continue;}
    if(c.nodeType!==1)continue;
    var t=c.tagName;
    if(!BL[t]){pend.push(c);continue;}
    flush();
    if(t!=="BLOCKQUOTE")prevQ=null;
    if(t==="FIGURE"){if(c.classList.contains("fig")){var src=c.getAttribute("data-src");if(src){var fc=c.querySelector(".fc"),fr=c.querySelector(".fr");out.push({t:"img",src:src,cap:(fc&&fc.value||"").trim(),credit:(fr&&fr.value||"").trim()});}}}
    else if(/^H[1-6]$/.test(t)){var tx=c.textContent.replace(/\s+/g," ").trim();if(tx)out.push({t:"h",text:tx});}
    else if(t==="UL"||t==="OL"){var items=[];for(var li=c.firstChild;li;li=li.nextSibling){if(li.tagName==="LI"){var t2=inl(li).replace(/\s+/g," ").trim();if(t2)items.push(t2);}}if(items.length)out.push({t:t.toLowerCase(),items:items});}
    else if(t==="BLOCKQUOTE"){
      var parts=[];walk(c,parts);var t3=parts.filter(function(x){return typeof x==="string";}).join(" ").trim();
      if(t3){
        if(prevQ&&prevQ.el===c.previousElementSibling){prevQ.q.text+=" "+t3;prevQ.el=c;}
        else{var q={t:"q",text:t3},by=c.getAttribute("data-by");if(by)q.by=by;out.push(q);prevQ={q:q,el:c};}
      }
      parts.filter(function(x){return typeof x!=="string";}).forEach(function(x){out.push(x);});
      continue;
    }
    else if(hasBlock(c))walk(c,out);
    else{var t4=inl(c).replace(/\s+/g," ").trim();if(t4)out.push(t4);}
  }
  flush();
}
function readBody(){var out=[];var b=$("e_body");if(b)walk(b,out);return out;}
function syncEditor(){
  var s=data&&data.stories[ei];if(!s||!$("e_title"))return;

/* selection helpers */
document.addEventListener("selectionchange",function(){
  var b=$("e_body");if(!b)return;var sel=window.getSelection();
  if(sel.rangeCount&&b.contains(sel.anchorNode))lastRange=sel.getRangeAt(0).cloneRange();
});
function ensureSel(){
  var b=$("e_body"),sel=window.getSelection();
  if(sel.rangeCount&&b.contains(sel.anchorNode))return;
  b.focus();var r=document.createRange();
  if(lastRange&&b.contains(lastRange.commonAncestorContainer)){r=lastRange;}else{r.selectNodeContents(b);r.collapse(false);}
  sel.removeAllRanges();sel.addRange(r);
}
function curBlock(){var v="";try{v=(document.queryCommandValue("formatBlock")||"").toLowerCase().replace(/[<>]/g,"");}catch(e){}return v;}
function doCmd(c){
  var b=$("e_body");ensureSel();b.focus();
  try{document.execCommand("defaultParagraphSeparator",false,"p");}catch(e){}
  if(c==="p")document.execCommand("formatBlock",false,"p");
  else if(c==="h3")document.execCommand("formatBlock",false,curBlock()==="h3"?"p":"h3");
  else if(c==="quote")document.execCommand("formatBlock",false,curBlock()==="blockquote"?"p":"blockquote");
  else if(c==="bold"||c==="italic")document.execCommand(c,false,null);
  else if(c==="ul")document.execCommand("insertUnorderedList",false,null);
  else if(c==="ol")document.execCommand("insertOrderedList",false,null);
  else if(c==="link")openLink();
  else if(c==="img")$("pickBody").click();
  syncEmpty();onEdit();
}
function openLink(){
  var sel=window.getSelection();if(sel.rangeCount)lastRange=sel.getRangeAt(0).cloneRange();
  var bar=$("linkBar");bar.hidden=false;var a=null,n=sel.anchorNode;
  while(n&&n!==$("e_body")){if(n.tagName==="A"){a=n;break;}n=n.parentNode;}
  $("linkIn").value=a?a.getAttribute("href"):"";$("linkIn").focus();
}
function applyLink(remove){
  var b=$("e_body");b.focus();var sel=window.getSelection();sel.removeAllRanges();if(lastRange)sel.addRange(lastRange);
  if(remove){document.execCommand("unlink",false,null);}
  else{
    var u=$("linkIn").value.trim();if(!u){toast("주소를 입력하세요");return;}
    if(!/^(https?:\/\/|mailto:|\/|#)/i.test(u))u="https://"+u;
    if(sel.isCollapsed){document.execCommand("insertHTML",false,'<a href="'+esc(u)+'">'+esc(u)+'</a>');}
    else document.execCommand("createLink",false,u);
  }
  $("linkBar").hidden=true;onEdit();

/* images */
function shrink(file,max){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.86));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("decode"));};
    img.src=url;
  });
}
function gUrl(c,path){return "https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+path;}
function gHead(c,extra){var h={"Authorization":"Bearer "+c.token,"X-GitHub-Api-Version":"2022-11-28"};for(var k in extra)h[k]=extra[k];return h;}
function gErr(r){
  if(r.status===401)return "열쇠(토큰)가 틀렸거나 기간이 끝났습니다. 새로 만들어 붙여 넣으세요.";
  if(r.status===403)return "이 열쇠로는 고칠 권한이 없습니다. 토큰의 Contents 권한이 Read and write인지 확인하세요.";
  if(r.status===404)return "저장소나 파일을 찾지 못했습니다. 아이디와 저장소 이름, 그리고 열쇠가 이 저장소용인지 확인하세요.";
  if(r.status===409||r.status===422)return "그동안 다른 곳에서 파일이 바뀌었습니다. '연결·게시'에서 최신 내용을 불러온 뒤 다시 시도하세요.";
  return "처리하지 못했습니다 (오류 "+r.status+"). 잠시 뒤 다시 시도하세요.";
}
function uploadPhoto(file){
  if(!ghReady()){toast("사진을 올리려면 먼저 '연결·게시'에서 열쇠를 입력하세요");return Promise.reject();}
  if(!/^image\//.test(file.type)){toast("사진 파일만 올릴 수 있습니다");return Promise.reject();}
  var c=ghCfg(),name="images/"+stamp()+".jpg";
  return shrink(file,1800).then(function(du){
    imgCache[name]=du;
    return {name:name,du:du,send:function(){
      return fetch(gUrl(c,name),{method:"PUT",headers:gHead(c,{"Accept":"application/vnd.github+json","Content-Type":"application/json"}),body:JSON.stringify({message:"사진 추가",content:du.split(",")[1],branch:c.branch})})
        .then(function(r){if(!r.ok)throw r;return r.json();});
    }};
  },function(){toast("이 사진 형식은 읽을 수 없습니다. JPG나 PNG로 바꿔 올려 주세요.");throw 0;});
}

    var blk=null;if(rng&&b.contains(rng.commonAncestorContainer)){blk=rng.startContainer;while(blk&&blk.parentNode!==b)blk=blk.parentNode;}
    if(blk&&blk.parentNode===b)b.insertBefore(fig,blk.nextSibling);else b.appendChild(fig);
    if(!fig.nextSibling){var p=document.createElement("p");p.innerHTML="<br>";b.appendChild(p);}

  if(!ghReady()){gMsg("아이디, 저장소 이름, 열쇠를 먼저 채우세요.",true);return;}
  var c=ghCfg();gMsg("불러오는 중…",false);
  fetch(gUrl(c,"content.json")+"?ref="+c.branch+"&t="+Date.now(),{headers:gHead(c,{"Accept":"application/vnd.github.raw+json"}),cache:"no-store"})
   .then(function(r){if(!r.ok)throw r;return r.text();})
   .then(function(t){
     var d=JSON.parse(t);if(!d||!Array.isArray(d.stories))throw {status:0};
     var drafts=data.stories.filter(function(s){return s.draft;});
     var nd=fix(d);drafts.forEach(function(s){nd.stories.push(s);});data=fix(nd);persist();
     rawSet(K.pub,JSON.stringify(pubData()));refreshDot();gMsg("사이트의 최신 내용을 불러왔습니다. 작성 중인 기사는 그대로 남아 있습니다.",false);
   })
   .catch(function(r){gMsg(r&&r.status?gErr(r):"불러오지 못했습니다. 인터넷 연결을 확인하세요.",true);});
}
function copyText(t,ta){
  function fb(){ta.focus();ta.select();toast("선택했습니다. 복사하세요 (Ctrl/Cmd+C)");}
  try{navigator.clipboard.writeText(t).then(function(){toast("복사했습니다");}).catch(fb);}catch(e){fb();}
}

/* ---- events ---- */
document.addEventListener("mousedown",function(e){if(e.target.closest(".tbb"))e.preventDefault();});
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("mask")){closeModal();return;}
  var b=t.closest("button,a");if(!b)return;
  if(b.dataset.close&&b.tagName==="BUTTON"){closeModal();return;}
  if(b.dataset.tab){show(b.dataset.tab);return;}
  if(b.dataset.filt){filt=b.dataset.filt;viewList();return;}
  if(b.dataset.edit!==undefined){openEditor(+b.dataset.edit);return;}
  if(b.classList.contains("tbb")){doCmd(b.dataset.c);return;}
  if(b.classList.contains("fig-x")){var f=b.closest(".fig");if(f&&f.parentNode)f.parentNode.removeChild(f);syncEmpty();onEdit();return;}
  switch(b.id){
    case "newStory":newStory();return;
    case "back":syncEditor();ei=-1;show("stories");return;
    case "btnPreview":preview();return;
    case "btnPublish":publishFlow();return;
    case "pubGo":doPublish();return;
    case "linkOk":applyLink(false);return;
    case "linkCut":applyLink(true);return;
    case "linkNo":$("linkBar").hidden=true;return;
    case "coverDrop":case "coverChange":$("pickCover").click();return;
    case "coverDel":{var s=data.stories[ei];s.image="";s.credit="";$("coverBox").innerHTML=coverEmpty();persist();refreshDot();return;}
    case "pubSwitch":{
      syncEditor();var st=data.stories[ei];st.draft=!st.draft;persist();
      b.setAttribute("aria-checked",String(!st.draft));$("pubLabel").textContent=st.draft?"작성 중 (비공개)":"사이트에 공개";
      refreshDot();toast(st.draft?"작성 중으로 바꿨습니다. 올리면 사이트에서 빠집니다.":"공개로 바꿨습니다. '사이트에 올리기'를 누르면 반영됩니다.");return;
    }
    case "delStory":
      openModal('<h2>이 기사를 삭제할까요?</h2><p>삭제하면 되돌릴 수 없습니다. 사이트에서도 빼려면 삭제한 뒤 <b>사이트에 올리기</b>를 눌러야 합니다.</p><div class="row"><button class="btn" type="button" data-close="1">취소</button><button class="btn danger" type="button" id="delGo">삭제</button></div>');return;
    case "delGo":data.stories.splice(ei,1);ei=-1;persist();closeModal();show("stories");refreshDot();toast("삭제했습니다");return;
    case "clearSample":
      openModal('<h2>예시 콘텐츠를 모두 비울까요?</h2><p>기사와 모든 목록이 지워집니다. (작성 중인 기사도 포함)</p><div class="row"><button class="btn" type="button" data-close="1">취소</button><button class="btn danger" type="button" id="clearGo">비우기</button></div>');return;
    case "clearGo":data.stories=[];LISTS.forEach(function(l){data[l[0]]=[];});data.sample=false;persist();closeModal();show("site");refreshDot();toast("예시 콘텐츠를 비웠습니다");return;
    case "g_save":
      gh.owner=$("g_owner").value;gh.repo=$("g_repo").value;gh.token=$("g_token").value;gh.remember=$("g_remember").checked;
      try{localStorage.setItem(K.gh,JSON.stringify(gh.remember?{owner:gh.owner.trim(),repo:gh.repo.trim(),token:gh.token.trim()}:{owner:gh.owner.trim(),repo:gh.repo.trim()}));}catch(err){}
      gMsg(ghReady()?"저장했습니다. 이제 사진을 올리고 사이트에 올릴 수 있습니다.":"저장했습니다. 열쇠를 입력해야 올릴 수 있습니다.",!ghReady());return;
    case "g_load":gh.owner=$("g_owner").value;gh.repo=$("g_repo").value;gh.token=$("g_token").value;gLoad();return;
    case "g_dl":
      try{var bl=new Blob([JSON.stringify(pubData(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="content.json";document.body.appendChild(a);a.click();a.remove();toast("content.json을 저장합니다");}catch(err){toast("저장하지 못했습니다");}return;
    case "g_open":$("pickJson").click();return;
    case "copyPrompt":copyText(AIPROMPT,$("aiPrompt"));return;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&$("modalRoot").firstChild){closeModal();return;}
  if(e.target&&e.target.id==="e_title"&&e.key==="Enter"){e.preventDefault();var b=$("e_body");if(b)b.focus();return;}
  if(e.key==="Enter"&&!e.shiftKey&&e.target&&e.target.id==="e_body"){
    var sl=window.getSelection(),nd=sl.anchorNode;
    while(nd&&nd!==e.target&&nd.tagName!=="BLOCKQUOTE"&&nd.tagName!=="LI")nd=nd.parentNode;
    if(nd&&nd.tagName==="BLOCKQUOTE"&&!nd.textContent.trim()){e.preventDefault();document.execCommand("formatBlock",false,"p");return;}
  }
  if(e.target&&e.target.id==="linkIn"&&e.key==="Enter"){e.preventDefault();applyLink(false);return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"&&e.target&&e.target.id==="e_body"){e.preventDefault();openLink();}
});
document.addEventListener("input",function(e){
  var t=e.target,id=t.id||"";
  if(t.closest&&t.closest("#e_body")){syncEmpty();count();onEdit();return;}
  if(id==="q"){query=t.value;var pos=t.selectionStart;viewList();var q=$("q");q.focus();try{q.setSelectionRange(pos,pos);}catch(err){}return;}
  if(id==="e_title"){t.value=t.value.replace(/[\r\n]+/g," ");autoGrow(t);onEdit();return;}
  if(id.indexOf("e_")===0){onEdit();return;}
  if(id.indexOf("L_")===0){var key=id.slice(2);data[key]=t.value.split("\n").map(function(x){return x.trim();}).filter(Boolean).map(function(x){return x.split("|").map(function(c){return c.trim();});});persist();refreshDot();return;}
  if(id.indexOf("s_")===0&&id!=="s_sample"){data.site={name:$("s_name").value.trim(),org:$("s_org").value.trim(),contact:$("s_contact").value.split("\n").map(function(x){return x.trim();}).filter(Boolean),note:$("s_note").value.trim()};persist();refreshDot();return;}
  if(id.indexOf("c_")===0){data.social={youtube:{handle:$("c_yt_handle").value.trim(),channelId:$("c_yt_id").value.trim()},instagram:{handle:$("c_ig_handle").value.trim(),posts:$("c_ig_posts").value.split("\n").map(function(x){return x.trim();}).filter(Boolean)}};persist();refreshDot();return;}
});
document.addEventListener("change",function(e){
  var t=e.target,id=t.id||"";
  if(id==="s_sample"){data.sample=t.checked;persist();refreshDot();return;}
  if(id==="e_lead"){if(t.checked)data.stories.forEach(function(x){x.lead=false;});onEdit();return;}
  if(id==="e_feature"){
    if(t.checked){var n=data.stories.filter(function(x,i){return x.feature&&i!==ei;}).length;if(n>=3){t.checked=false;toast("기획 특집은 최대 3건입니다");return;}}
    onEdit();return;
  }
  if(id.indexOf("e_")===0){onEdit();return;}
  if(id==="pickBody"&&t.files[0]){addBodyPhoto(t.files[0]);t.value="";return;}
  if(id==="pickCover"&&t.files[0]){setCover(t.files[0]);t.value="";return;}
  if(id==="pickJson"&&t.files[0]){
    var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.stories))throw 0;data=fix(d);persist();refreshDot();toast("불러왔습니다");}catch(err){toast("올바른 content.json 파일이 아닙니다");}};r.readAsText(t.files[0]);t.value="";return;
  }
});
document.addEventListener("paste",function(e){
  var b=$("e_body");if(!b||!e.target||!e.target.closest||!e.target.closest("#e_body"))return;
  if(e.target.tagName==="INPUT")return;
  var cd=e.clipboardData;if(!cd)return;
  var f=cd.files&&cd.files[0];if(f&&/^image\//.test(f.type)){e.preventDefault();addBodyPhoto(f);return;}
  var txt=cd.getData("text/plain");if(txt==null)return;e.preventDefault();
  txt.replace(/\r/g,"").split(/\n+/).forEach(function(ln,i){if(i)document.execCommand("insertParagraph");if(ln)document.execCommand("insertText",false,ln);});
});
document.addEventListener("dragover",function(e){if(e.target.closest&&(e.target.closest("#e_body")||e.target.closest("#coverBox"))){e.preventDefault();}});
document.addEventListener("drop",function(e){
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f||!/^image\//.test(f.type))return;
  if(e.target.closest&&e.target.closest("#coverBox")){e.preventDefault();setCover(f);return;}
  if(e.target.closest&&e.target.closest("#e_body")){
    e.preventDefault();
    try{var r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;if(r)lastRange=r;}catch(err){}
    addBodyPhoto(f);
  }
});
boot();
})();
</script>
